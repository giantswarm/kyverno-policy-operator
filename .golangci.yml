version: "2"
run:
  allow-parallel-runners: true
linters:
  exclusions:
    generated: lax
    rules:
      # Table-driven tests repeat fixture strings (namespaces, policy names,
      # resource kinds) by design; hoisting them into constants hurts
      # readability of the cases.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
